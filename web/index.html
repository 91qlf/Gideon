</head>

    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>

  </svg>

  <div id="app">
    <section id="screen-feed" class="screen active">
      <div id="feed" class="feed"></div>
      <header class="feed-top">
        <div id="segmented" class="segmented glass">
          <div class="seg-thumb"></div>
          <button data-tab="foryou" class="on">Pour toi</button>
          <button data-tab="videos">Vidéos</button>
          <button data-tab="articles">Articles</button>
        </div>
        <button id="filter-chip" class="chip glass hidden"><svg class="ic"><use href="#i-x"/></svg><span></span></button>
        <button id="refresh" class="circle glass" aria-label="Actualiser"><svg class="ic"><use href="#i-refresh"/></svg></button>
      </header>
      <div id="toast" class="toast glass hidden"></div>
    </section>
    <section id="screen-search" class="screen list"></section>
    <section id="screen-saved" class="screen list"></section>
    <section id="screen-settings" class="screen list grouped"></section>
  </div>

  <nav id="tabbar">
    <div class="tabs glass">
      <div class="tab-pill"></div>
      <button class="tab on" data-screen="feed"><svg class="ic filled"><use href="#i-home"/></svg><span>À la une</span></button>
      <button class="tab" data-screen="saved"><svg class="ic filled"><use href="#i-bookmark"/></svg><span>Gardés</span></button>
      <button class="tab" data-screen="settings"><svg class="ic"><use href="#i-gear"/></svg><span>Réglages</span></button>
      <button class="tab-folded" aria-label="Retour"><svg class="ic filled"><use href="#i-home"/></svg></button>
    </div>
    <label class="searchbox glass">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Rechercher" enterkeyhint="search" autocomplete="off" autocorrect="off">
      <button id="q-clear" class="hidden" aria-label="Effacer"><svg class="ic"><use href="#i-x"/></svg></button>
    </label>
  </nav>

  <div id="sheet" class="sheet-host" aria-hidden="true">
    <div class="sheet-dim"></div>
    <div class="sheet">
      <div class="grabber"><span></span></div>
      <div class="sheet-bar">
        <button class="circle glass" data-act="close" aria-label="Fermer"><svg class="ic"><use href="#i-x"/></svg></button>
        <span class="grow"></span>
        <button class="circle glass" data-act="text" aria-label="Taille du texte"><svg class="ic"><use href="#i-text"/></svg></button>
        <button class="circle glass" data-act="share" aria-label="Partager"><svg class="ic"><use href="#i-share"/></svg></button>
        <button class="circle glass" data-act="save" aria-label="Garder"><svg class="ic"><use href="#i-bookmark"/></svg></button>
      </div>
      <div class="sheet-scroll"></div>
    </div>
  </div>

  <div id="splash">
    <svg viewBox="0 0 108 108" class="logo"><g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(-1.8,-1.4)" d="M67.44,40.56 A19,19 0 1,0 73,54 L56,54" stroke="#2FE6FF"/><path transform="translate(1.8,1.4)" d="M67.44,40.56 A19,19 0 1,0 73,54 L56,54" stroke="#FF2D6F"/><path d="M67.44,40.56 A19,19 0 1,0 73,54 L56,54" stroke="#fff"/></g></svg>
    <div class="spinner"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
