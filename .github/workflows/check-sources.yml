name: Check sources

on:
  push:
    paths:
      - "app/src/main/assets/**"
      - "app/src/main/java/app/gideon/data/**"
      - "app/src/test/**"
      - ".github/workflows/check-sources.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + live sources report
        env:
          GIDEON_LIVE: "1"
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Publish report
        if: always()
        run: |
          if [ -f app/build/reports/live-sources.md ]; then
            cat app/build/reports/live-sources.md >> "$GITHUB_STEP_SUMMARY"
            echo "=== LIVE REPORT ==="
            cat app/build/reports/live-sources.md
          fi
